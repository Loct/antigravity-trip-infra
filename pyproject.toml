[project]
name = "antigravity-trip-infra"
version = "0.1.0"
description = "Remote Antigravity CLI environment with Wanderlog CLI & MCP integration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.0.0",
    "anthropic>=0.30.0",
    "openai>=1.40.0",
    "chainlit>=1.3.0",
    "aiosqlite>=0.20.0",
    "sqlalchemy>=2.0.0",
    "greenlet>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "detect-secrets==1.5.0",
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501", # line too long (handled by formatter)
    "E402", # module level import not at top of file
    "F841", # local variable assigned but never used
]

[tool.ruff.lint.isort]
known-first-party = [
    "agoda",
    "ai_council",
    "booking",
    "claude_validator",
    "cross_check_validator",
    "deepseek_validator",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
